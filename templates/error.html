{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card p-4 text-center mx-auto" style="max-width:520px"><h1 class="display-5">{{ code }}</h1><p>{{ message }}</p>
<a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Back to dashboard</a></div>
{% endblock %}
{% block public %}
<div class="login-wrap"><div class="card p-4 text-center" style="max-width:420px"><h1 class="display-5">{{ code }}</h1><p>{{ message }}</p>
<a class="btn btn-primary" href="{{ url_for('auth.login') }}">Go to sign in</a></div></div>
{% endblock %}
